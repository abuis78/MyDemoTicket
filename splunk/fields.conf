# The HEC sender adds "tenant" as indexed field (HEC "fields": {"tenant": ...}) and
# does NOT repeat it in the JSON event body, so there is exactly one tenant value.
# Declaring it INDEXED makes  tenant=soc-games  use the index-time value; tenant::soc-games
# and tstats work regardless. Deploy to the search heads.

[tenant]
INDEXED = true
INDEXED_VALUE = false
