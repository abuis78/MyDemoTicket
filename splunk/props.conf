# MyDemoTicket audit events (sourcetype mydemoticket:audit)
#
# Deploy to the indexers / heavy forwarders (index-time settings) and to the
# search heads (KV_MODE). Events arrive either via HEC (/services/collector/event,
# one JSON object per event, timestamp taken from the HEC "time" field) or as
# JSON lines from the local fallback file <data_dir>/logs/audit.log.

[mydemoticket:audit]
category = Application
description = MyDemoTicket audit trail (JSON, one event per line)
pulldown_type = 1

# One event per line - never merge lines, never break inside an event.
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 100000

# Timestamp: "ts":"2026-11-24T10:15:30.123Z" (always UTC).
TIME_PREFIX = \"ts\"\s*:\s*\"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%3QZ
MAX_TIMESTAMP_LOOKAHEAD = 30
TZ = UTC

# Search-time JSON field extraction (fields: tenant, action, actor, role, outcome,
# object_type, object_id, source, ip, request_id, details.*, app, version).
KV_MODE = json
AUTO_KV_JSON = true
# Events are plain UTF-8 text.
NO_BINARY_CHECK = true

# Readable names for dashboards.
FIELDALIAS-mdt_user = actor AS user
FIELDALIAS-mdt_src = ip AS src
EVAL-mdt_from_state = 'details.from'
EVAL-mdt_to_state = 'details.to'
